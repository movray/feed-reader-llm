apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "feedreader.fullname" . }}-nginx
  labels:
    {{- include "feedreader.labels" . | nindent 4 }}
data:
  default.conf: |
    {{- .Files.Get "files/nginx-default.conf" | nindent 4 }}
  loading.html: |
    {{- .Files.Get "files/nginx-loading.html" | nindent 4 }}
