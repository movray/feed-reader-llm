{{- $image := include "feedreader.image" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "feedreader.fullname" . }}
  labels:
    {{- include "feedreader.labels" . | nindent 4 }}
    app.kubernetes.io/component: app
spec:
  # One pod only: generator and API talk through files on the shared volume,
  # and a second generator would summarize every article twice.
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "feedreader.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: app
  template:
    metadata:
      annotations:
        checksum/nginx: {{ include (print $.Template.BasePath "/nginx-configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "feedreader.labels" . | nindent 8 }}
        app.kubernetes.io/component: app
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      volumes:
        - name: html
          {{- if .Values.html.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "feedreader.fullname" . }}-html
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: nginx-config
          configMap:
            name: {{ include "feedreader.fullname" . }}-nginx
        - name: tmp-api
          emptyDir: {}
        - name: tmp-nginx
          emptyDir: {}

      initContainers:
        # Creates or updates the schema; waits until the database is up.
        - name: migrate
          image: {{ $image }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: [migrate]
          env:
            {{- include "feedreader.db.env" . | nindent 12 }}
            - name: LLM_BASE_URL
              value: {{ .Values.llm.baseUrl | quote }}
            - name: LLM_MODEL
              value: {{ .Values.llm.model | quote }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.migrate.resources | nindent 12 }}

      containers:
        - name: nginx
          image: "{{ .Values.nginx.image.repository }}:{{ .Values.nginx.image.tag }}"
          imagePullPolicy: {{ .Values.nginx.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          volumeMounts:
            - name: html
              mountPath: /usr/share/nginx/html
              readOnly: true
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
            - name: nginx-config
              mountPath: /error-pages/loading.html
              subPath: loading.html
            - name: tmp-nginx
              mountPath: /tmp
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 30
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.nginx.resources | nindent 12 }}

        - name: generator
          image: {{ $image }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: [generator]
          env:
            {{- include "feedreader.db.env" . | nindent 12 }}
            # Fallback when the llm_config table cannot be read.
            - name: LLM_BASE_URL
              value: {{ .Values.llm.baseUrl | quote }}
            - name: LLM_MODEL
              value: {{ .Values.llm.model | quote }}
            - name: GENERATOR_MAX_AGE_SECONDS
              value: {{ .Values.generator.livenessProbe.maxAgeSeconds | quote }}
            {{- with .Values.generator.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          volumeMounts:
            - name: html
              mountPath: /html
          {{- if .Values.generator.livenessProbe.enabled }}
          livenessProbe:
            exec:
              command: [/app/entrypoint.sh, healthcheck-generator]
            initialDelaySeconds: 120
            periodSeconds: 60
            failureThreshold: 3
          {{- end }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.generator.resources | nindent 12 }}

        - name: api
          image: {{ $image }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: [api]
          env:
            {{- include "feedreader.db.env" . | nindent 12 }}
            - name: GUNICORN_WORKERS
              value: {{ .Values.api.workers | quote }}
            - name: GUNICORN_THREADS
              value: {{ .Values.api.threads | quote }}
            - name: GUNICORN_TIMEOUT
              value: {{ .Values.api.timeout | quote }}
            {{- with .Values.api.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - name: api
              containerPort: 5000
              protocol: TCP
          volumeMounts:
            - name: html
              mountPath: /html
            # gunicorn worker heartbeat files
            - name: tmp-api
              mountPath: /tmp
          readinessProbe:
            httpGet:
              path: /api/sources
              port: api
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/sources
              port: api
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 3
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
