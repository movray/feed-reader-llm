{{- if and (not .Values.postgresql.enabled) (not .Values.database.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "feedreader.db.secretName" . }}
  labels:
    {{- include "feedreader.labels" . | nindent 4 }}
type: Opaque
stringData:
  username: {{ required "database.user is required (or database.existingSecret)" .Values.database.user | quote }}
  password: {{ required "database.password is required (or database.existingSecret)" .Values.database.password | quote }}
{{- end }}
