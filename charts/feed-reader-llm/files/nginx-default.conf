# nginx in the feed-reader-llm pod: serves the generated HTML from the shared
# volume and proxies /api/ to the API container (same pod, localhost).
server {
  listen 8080;
  listen [::]:8080;
  server_tokens off;

  error_page 403 404 /loading.html;
  location = /loading.html {
    root /error-pages;
    internal;
  }
  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }
  location /api/ {
    proxy_pass http://127.0.0.1:5000/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
  location / {
    root /usr/share/nginx/html;
    index index.html;
  }
}
