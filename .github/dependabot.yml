# Weekly, grouped, so that updates come as a few pull requests. Security
# updates come as soon as an advisory is published, independent of this
# schedule.
version: 2
updates:
  # app/requirements.txt (pinned with hashes). Keep app/requirements.in in
  # line when a direct dependency moves (CI checks it).
  - package-ecosystem: pip
    directory: /app
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]
    commit-message:
      prefix: "chore(deps)"

  # Base image of the Dockerfile (tag and digest).
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Odd minors are nginx mainline; compose and the chart (values.yaml,
      # not seen by Dependabot) stay on the stable line and move together
      # by hand.
      - dependency-name: nginxinc/nginx-unprivileged
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci"
