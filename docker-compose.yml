# Local test setup without Kubernetes: `docker compose up --build`, then
# open http://localhost:8080. Set the LLM in the CONF LLM dialog or via
# LLM_BASE_URL / LLM_MODEL below (read on the first start only).
#
# Generator, API and nginx share one network namespace and the /html volume,
# like the containers of the Kubernetes pod.

x-app: &app
  image: feed-reader-llm:dev
  build: .
  environment: &app-env
    DB_HOST: db
    DB_PORT: "5432"
    DB_NAME: feedconfig
    DB_USER: feedreader
    DB_PASSWORD: feedreader
    LLM_BASE_URL: ${LLM_BASE_URL:-http://host.docker.internal:11434/v1}
    LLM_MODEL: ${LLM_MODEL:-}

services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: feedconfig
      POSTGRES_USER: feedreader
      POSTGRES_PASSWORD: feedreader
    volumes:
      - db:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U feedreader -d feedconfig"]
      interval: 5s
      retries: 20

  migrate:
    <<: *app
    command: ["migrate"]
    depends_on:
      db:
        condition: service_healthy

  api:
    <<: *app
    command: ["api"]
    extra_hosts:   # an LLM on the Docker host
      - host.docker.internal:host-gateway
    ports:
      - "${PORT:-8080}:8080"   # nginx, which runs in this network namespace
    volumes:
      - html:/html
    depends_on:
      migrate:
        condition: service_completed_successfully

  generator:
    <<: *app
    command: ["generator"]
    network_mode: service:api
    volumes:
      - html:/html
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "/app/entrypoint.sh", "healthcheck-generator"]
      interval: 60s
      start_period: 120s

  nginx:
    image: nginxinc/nginx-unprivileged:1.31-alpine
    network_mode: service:api
    volumes:
      # nocopy: the volume must not be seeded with nginx's own index.html;
      # api and generator seed it from their image (owned by uid 10001).
      - type: volume
        source: html
        target: /usr/share/nginx/html
        read_only: true
        volume:
          nocopy: true
      - ./charts/feed-reader-llm/files/nginx-default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./charts/feed-reader-llm/files/nginx-loading.html:/error-pages/loading.html:ro
    depends_on:
      - api

volumes:
  db:
  html:
